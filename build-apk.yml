name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Siapkan aset web (www/)
        run: node scripts/prepare.mjs

      - name: Buat proyek Android
        run: npx cap add android

      - name: Patch (izin kamera, plugin cetak, ikon)
        run: node scripts/patch-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK (debug, sudah ter-sign)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Scanner-LJK-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
